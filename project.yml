# ForkRoad — XcodeGen project definition.
# Generate the Xcode project with:  xcodegen generate
# (Install once with:  brew install xcodegen)
#
# Info.plist and .entitlements files are generated from this file, so edit
# them here, not in Xcode.

name: ForkRoad

options:
  bundleIdPrefix: com.chipmullins
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  PickerCore:
    path: Packages/PickerCore
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    # Stays on Firebase 11.x, which builds with Xcode 16.0 and later.
    minVersion: 11.0.0
    maxVersion: 12.0.0

settingGroups:
  common:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "0.4.0"
    CURRENT_PROJECT_VERSION: "12"
    CODE_SIGN_STYLE: Automatic
    # Set your Apple Developer team ID here (or pick the team in Xcode).
    DEVELOPMENT_TEAM: ""
    OTHER_LDFLAGS: ["$(inherited)", "-ObjC"]
    # The Firebase-config copy script reads Config/, outside the build sandbox.
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  ForkRoad:
    type: application
    platform: iOS
    sources:
      - path: ForkRoad
      - path: Shared
      # Apple's privacy manifest, and license texts for Settings → Acknowledgements.
      - path: Config/Privacy/App/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: Licenses
        type: folder
        buildPhase: resources
    postCompileScripts:
      - &copyFirebaseConfig
        # Copies Config/GoogleService-Info.plist into the bundle when it exists, so
        # the project still builds (without group voting) before Firebase is set up.
        name: Copy Firebase config (if present)
        basedOnDependencyAnalysis: false
        script: |
          PLIST="$SRCROOT/Config/GoogleService-Info.plist"
          DEST="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH"
          if [ -f "$PLIST" ]; then
            mkdir -p "$DEST"
            cp "$PLIST" "$DEST/"
          else
            echo "Firebase config not found; group voting is off until you add Config/GoogleService-Info.plist (see README)."
          fi
    dependencies:
      - package: PickerCore
      - package: Firebase
        product: FirebaseCore
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseMessaging
      - target: ForkRoadMessages
      - target: ForkRoadWidgets
    info:
      path: ForkRoad/Info.plist
      properties:
        CFBundleDisplayName: ForkRoad
        # Only standard HTTPS, which is exempt: skips the export question on upload.
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [remote-notification]
        CFBundleURLTypes:
          - CFBundleURLName: com.chipmullins.forkroad
            CFBundleURLSchemes: [forkroad]
        UIAppFonts: &appFonts
          - Outfit-SemiBold.ttf
          - Outfit-Bold.ttf
          - Outfit-ExtraBold.ttf
          - DMSans-Regular.ttf
          - DMSans-Medium.ttf
          - DMSans-SemiBold.ttf
          - DMSans-Bold.ttf
        NSLocationWhenInUseUsageDescription: "ForkRoad uses your location to find restaurants near you."
        NSCalendarsWriteOnlyAccessUsageDescription: "ForkRoad adds your group’s dinner plan to your calendar when you ask."
        AppIdentifierPrefix: $(AppIdentifierPrefix)
    entitlements:
      path: ForkRoad/ForkRoad.entitlements
      properties:
        com.apple.security.application-groups: [group.com.chipmullins.forkroad]
        keychain-access-groups: ["$(AppIdentifierPrefix)com.chipmullins.forkroad.shared"]
        com.apple.developer.icloud-container-identifiers: [iCloud.com.chipmullins.forkroad]
        com.apple.developer.icloud-services: [CloudKit]
        aps-environment: development
    settings:
      groups: [common]
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chipmullins.forkroad
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  ForkRoadMessages:
    type: app-extension.messages
    platform: iOS
    sources:
      - path: MessagesExtension
      - path: Shared
      - path: Config/Privacy/Messages/PrivacyInfo.xcprivacy
        buildPhase: resources
    postCompileScripts:
      - *copyFirebaseConfig
    dependencies:
      - package: PickerCore
      - package: Firebase
        product: FirebaseCore
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
    info:
      path: MessagesExtension/Info.plist
      properties:
        CFBundleDisplayName: ForkRoad
        UIAppFonts: *appFonts
        NSLocationWhenInUseUsageDescription: "ForkRoad uses your location to work out when you should leave for dinner. It stays on your phone."
        NSCalendarsWriteOnlyAccessUsageDescription: "ForkRoad adds your group’s dinner plan to your calendar when you ask."
        NSExtension:
          NSExtensionPointIdentifier: com.apple.message-payload-provider
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).MessagesViewController
        AppIdentifierPrefix: $(AppIdentifierPrefix)
    entitlements:
      path: MessagesExtension/ForkRoadMessages.entitlements
      properties:
        com.apple.security.application-groups: [group.com.chipmullins.forkroad]
        keychain-access-groups: ["$(AppIdentifierPrefix)com.chipmullins.forkroad.shared"]
    settings:
      groups: [common]
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chipmullins.forkroad.messages
        ASSETCATALOG_COMPILER_APPICON_NAME: iMessage App Icon

  ForkRoadWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: ForkRoadWidgets
      - path: Shared/UI
      - path: Shared/Support
      - path: Shared/Fonts
      - path: Shared/Resources
      - path: Config/Privacy/Widgets/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: PickerCore
    info:
      path: ForkRoadWidgets/Info.plist
      properties:
        CFBundleDisplayName: ForkRoad
        UIAppFonts: *appFonts
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: ForkRoadWidgets/ForkRoadWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.com.chipmullins.forkroad]
    settings:
      groups: [common]
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chipmullins.forkroad.widgets

schemes:
  ForkRoad:
    build:
      targets:
        ForkRoad: all
    run:
      config: Debug
  # Run this scheme and choose Messages when Xcode asks which app to launch,
  # to debug the iMessage extension with its console output.
  ForkRoadMessages:
    build:
      targets:
        ForkRoadMessages: all
        ForkRoad: all
    run:
      config: Debug
      askForAppToLaunch: true
      launchAutomaticallySubstyle: "2"

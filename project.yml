# ForkRoad — XcodeGen project definition.
# Generate the Xcode project with:  xcodegen generate
# (Install once with:  brew install xcodegen)

name: ForkRoad

options:
  bundleIdPrefix: com.chipmullins
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  PickerCore:
    path: Packages/PickerCore

targets:
  ForkRoad:
    type: application
    platform: iOS
    sources:
      - path: ForkRoad
    dependencies:
      - package: PickerCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chipmullins.forkroad
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: ForkRoad
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "ForkRoad uses your location to find restaurants near you."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic

schemes:
  ForkRoad:
    build:
      targets:
        ForkRoad: all
    run:
      config: Debug

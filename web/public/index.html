<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0B0B0F">
  <title>ForkRoad · Vote</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap">
  <style>
    :root {
      --night: #0B0B0F; --surface: #16161D; --surface-high: #1F1F29;
      --text: #F5F3EE; --muted: #A19FAA; --saffron: #FFB23F; --on-saffron: #1B1306;
      --danger: #FF8A7A; --hairline: rgba(255,255,255,0.07);
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--night); color: var(--text); font: 15px/1.45 'DM Sans', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    main { max-width: 480px; margin: 0 auto; padding: 28px 16px 120px; }
    .brand { display: flex; align-items: center; gap: 8px; color: var(--saffron); font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
    .brand svg { width: 26px; height: 26px; }
    h1 { font-family: Outfit, sans-serif; font-weight: 800; font-size: 32px; line-height: 1.05; letter-spacing: -0.02em; margin: 14px 0 6px; }
    .muted { color: var(--muted); }
    .card { background: var(--surface); border: 1px solid var(--hairline); border-radius: 20px; padding: 16px; }
    .stack { display: flex; flex-direction: column; gap: 10px; }
    .option { width: 100%; text-align: left; font: inherit; color: inherit; cursor: pointer; background: var(--surface); border: 1.5px solid var(--hairline); border-radius: 20px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
    .option.mine { border-color: var(--saffron); }
    .option:disabled { cursor: default; }
    .row { display: flex; align-items: center; gap: 12px; }
    .tile { width: 44px; height: 44px; border-radius: 12px; flex: none; display: grid; place-items: center; font: 800 20px Outfit, sans-serif; }
    .name { font-weight: 600; font-size: 16px; }
    .sub { font-size: 12px; color: var(--muted); }
    .count { margin-left: auto; font: 800 22px Outfit, sans-serif; }
    .bar { height: 8px; border-radius: 4px; background: #23232E; overflow: hidden; }
    .bar > span { display: block; height: 100%; border-radius: 4px; background: #5C5A66; transition: width .4s ease; }
    .lead .bar > span { background: var(--saffron); }
    .lead .count { color: var(--saffron); }
    .pill { display: inline-block; padding: 3px 7px; border-radius: 6px; background: var(--saffron); color: var(--on-saffron); font-size: 10px; font-weight: 800; letter-spacing: .06em; margin-left: 6px; vertical-align: 2px; }
    .winner { background: var(--saffron); color: var(--on-saffron); border-radius: 26px; padding: 20px; }
    .winner .label { font-size: 12px; font-weight: 800; letter-spacing: .1em; }
    .winner h2 { font: 800 32px/1.05 Outfit, sans-serif; margin: 8px 0; }
    .btn { display: flex; align-items: center; justify-content: center; min-height: 52px; border-radius: 16px; border: 0; font: 700 15px 'DM Sans', sans-serif; text-decoration: none; cursor: pointer; }
    .btn.primary { background: var(--saffron); color: var(--on-saffron); }
    .btn.light { background: var(--text); color: var(--night); }
    .btn.ghost { background: var(--surface-high); color: var(--text); }
    .btn:disabled { opacity: .5; }
    label { font-weight: 600; display: block; margin-bottom: 8px; }
    input { width: 100%; height: 50px; border-radius: 14px; border: 1px solid var(--hairline); background: var(--surface-high); color: var(--text); font: 600 16px 'DM Sans', sans-serif; padding: 0 14px; }
    input:focus-visible, .option:focus-visible, .btn:focus-visible { outline: 2px solid var(--saffron); outline-offset: 2px; }
    .error { color: var(--danger); }
    .code { font: 800 18px ui-rounded, Outfit, sans-serif; letter-spacing: .06em; }
    footer { margin-top: 28px; font-size: 13px; color: var(--muted); text-align: center; }
    .note { display: flex; gap: 10px; align-items: flex-start; background: rgba(255,178,63,0.14); border-radius: 18px; padding: 14px; margin-top: 14px; }
    .note .by { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .section-label { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 22px 0 10px; }
    .breakdown { background: var(--surface); border: 1px solid var(--hairline); border-radius: 20px; padding: 0 14px; }
    .breakdown .item { display: flex; align-items: center; gap: 12px; padding: 10px 0; }
    .breakdown .item + .item { border-top: 1px solid var(--hairline); }
    .breakdown .tile { width: 36px; height: 36px; border-radius: 10px; font-size: 16px; }
    .breakdown .count { font-size: 20px; }
    .breakdown .won .count { color: var(--saffron); }
    .breakdown .crown { color: var(--saffron); margin-left: 6px; font-size: 12px; }
    .suggest-panel { margin-top: 10px; }
    .result { width: 100%; text-align: left; font: inherit; color: inherit; cursor: pointer; background: var(--surface-high); border: 1px solid var(--hairline); border-radius: 16px; padding: 10px 12px; display: flex; align-items: center; gap: 12px; }
    .result:disabled { cursor: default; opacity: .55; }
    .result .add { margin-left: auto; color: var(--saffron); font-weight: 700; font-size: 14px; white-space: nowrap; }
    .result .tile { width: 36px; height: 36px; border-radius: 10px; font-size: 16px; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <div class="brand">
      <svg viewBox="0 0 200 200" aria-hidden="true"><rect width="200" height="200" rx="45" fill="#16161D"/><g transform="translate(20 12) scale(0.8)" fill="none" stroke-linecap="round" stroke="#FFB23F"><path d="M100 122 L100 178" stroke-width="30"/><path d="M100 124 L100 40" stroke-width="24"/><path d="M100 124 C100 96, 60 88, 60 48" stroke-width="24"/><path d="M100 124 C100 96, 140 88, 140 48" stroke-width="24"/></g></svg>
      ForkRoad
    </div>

    <section id="loading"><p class="muted">Loading…</p></section>

    <section id="error" hidden>
      <h1>Hmm.</h1>
      <p class="error" id="error-text"></p>
    </section>

    <section id="name-step" hidden>
      <h1 id="name-title">Help pick dinner</h1>
      <p class="muted" id="name-sub"></p>
      <form id="name-form" class="card stack" style="margin-top:18px">
        <div>
          <label for="name-input">Your first name</label>
          <input id="name-input" autocomplete="given-name" maxlength="30" required>
        </div>
        <button class="btn primary" type="submit">Continue</button>
      </form>
    </section>

    <section id="vote-step" hidden>
      <h1 id="title"></h1>
      <p class="muted" id="status"></p>
      <div id="options" class="stack" style="margin-top:18px"></div>
      <div id="suggest" style="margin-top:10px" hidden>
        <button class="btn ghost" id="suggest-open" type="button" style="width:100%">+ Suggest a place</button>
        <div id="suggest-panel" class="card stack suggest-panel" hidden>
          <div>
            <label for="suggest-input">Search restaurants</label>
            <input id="suggest-input" type="search" placeholder="A name or a craving, like “tacos”" autocomplete="off" enterkeyhint="search">
          </div>
          <p class="muted" id="suggest-status" style="margin:0;font-size:13px" aria-live="polite"></p>
          <div id="suggest-results" class="stack"></div>
          <button class="btn ghost" id="suggest-close" type="button">Done</button>
        </div>
      </div>
      <p class="muted" style="font-size:13px;margin-top:14px">Tap a place to vote. Tap it again to take your vote back. Ties are broken fairly by the app.</p>
    </section>

    <section id="decided-step" hidden>
      <div class="winner">
        <div class="label">THE GROUP PICKED</div>
        <h2 id="winner-name"></h2>
        <div id="winner-detail" style="font-weight:600"></div>
      </div>
      <div class="stack" style="margin-top:14px">
        <a class="btn light" id="apple-maps" target="_blank" rel="noopener">Directions in Apple Maps</a>
        <a class="btn ghost" id="google-maps" target="_blank" rel="noopener">Directions in Google Maps</a>
        <a class="btn ghost" id="website" target="_blank" rel="noopener" hidden>Menu &amp; hours</a>
      </div>
      <div class="note" id="note" hidden>
        <span aria-hidden="true">💬</span>
        <div><div id="note-text" style="font-weight:600"></div><div class="by" id="note-by"></div></div>
      </div>
      <div id="breakdown-wrap" hidden>
        <div class="section-label">How everyone voted</div>
        <div class="breakdown" id="breakdown"></div>
      </div>
    </section>

    <footer id="footer" hidden>
      Have ForkRoad? Join in the app with code <span class="code" id="code"></span>
    </footer>
  </main>

  <script type="module" src="/app.js"></script>
</body>
</html>
